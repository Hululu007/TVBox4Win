name: android-apk

# 本机没有 Linux 构建环境（p4a 不支持在 Windows 上编译），
# 因此安卓包统一在 GitHub Actions 的 Ubuntu 上构建，产物从 Artifacts 下载。
on:
  workflow_dispatch:
    inputs:
      archs:
        description: "目标架构（真机 arm64-v8a；逍遥/MEmu 等 x86 模拟器用 x86_64）"
        required: false
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - x86_64
          - "arm64-v8a, armeabi-v7a"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev ccache
          python -m pip install --upgrade pip
          # p4a 目前仍要求 Cython 0.29.x
          pip install --upgrade buildozer "cython==0.29.36"

      - name: Generate vendor/ from the desktop business layer
        working-directory: android
        run: |
          python sync_core.py
          python -m compileall -q vendor/tvboxosc androidui main.py

      - name: Offline business chain self-test
        working-directory: android
        run: python tests/smoke_core.py || true   # 网络受限时不阻塞打包

      - name: Point buildozer at the requested architecture
        working-directory: android
        run: |
          ARCHS="${{ github.event.inputs.archs }}"
          if [ -n "$ARCHS" ]; then
            sed -i "s/^android.archs.*/android.archs = $ARCHS/" buildozer.spec
          fi
          grep -E "^android.archs|^requirements|^version" buildozer.spec

      - name: Cache buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug 2>&1 | tee build.log | tail -n 120
          ls -lh bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox4Win-apk
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: android/build.log
